<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Customer</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#111827;
            color:white;
        }

        .container{
            width:700px;
            margin:50px auto;
            background:#1f2937;
            padding:35px;
            border-radius:15px;
            box-shadow:0 0 20px rgba(0,0,0,.4);
        }

        h2{
            margin-bottom:25px;
        }

        label{
            display:block;
            margin-top:18px;
            margin-bottom:8px;
            font-weight:bold;
        }

        input,
        select{
            width:100%;
            padding:12px;
            border:none;
            border-radius:8px;
            background:#374151;
            color:white;
            font-size:15px;
        }

        input:focus,
        select:focus{
            outline:none;
            border:2px solid #7c5cff;
        }

        .buttons{
            margin-top:30px;
            display:flex;
            gap:15px;
        }

        button{
            background:#7c5cff;
            color:white;
            border:none;
            padding:12px 24px;
            border-radius:8px;
            cursor:pointer;
            font-size:15px;
        }

        button:hover{
            background:#6b4ef5;
        }

        .cancel{
            background:#4b5563;
            text-decoration:none;
            color:white;
            padding:12px 24px;
            border-radius:8px;
        }

        .cancel:hover{
            background:#374151;
        }

    </style>

</head>

<body>

<div class="container">

<h2>Add New Customer</h2>

<form method="POST">

<label>Full Name</label>
<input
    type="text"
    name="full_name"
    placeholder="Enter customer name"
    required
>

<label>Phone</label>
<input
    type="tel"
    name="phone"
    maxlength="10"
    pattern="[0-9]{10}"
    placeholder="Enter 10-digit mobile number"
    required
>

<label>Email</label>
<input
    type="email"
    name="email"
    placeholder="example@email.com"
>

<label>City</label>
<input
    type="text"
    name="city"
    placeholder="Enter city"
>

<label>Source</label>

<select name="source" required>

    <option value="">-- Select Source --</option>

    <option value="Website">🌐 Website</option>
    <option value="Phone Call">📞 Phone Call</option>
    <option value="WhatsApp">💬 WhatsApp</option>
    <option value="Walk-in">🚶 Walk-in</option>
    <option value="Facebook">📘 Facebook</option>
    <option value="Instagram">📷 Instagram</option>
    <option value="Referral">🤝 Referral</option>

</select>

<div class="buttons">

    <button type="submit">Save Customer</button>

    <a href="{{ url_for('customer.customer_list') }}" class="cancel">
        Cancel
    </a>

</div>

</form>

</div>

</body>
</html>
